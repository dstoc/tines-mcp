name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    name: validate workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions structure and contexts
        run: |
          lint_dir=$(mktemp -d)
          trap 'rm -rf -- "$lint_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $lint_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Test release gates without registry writes
        run: python3 -m unittest discover -s tests/release -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build container image
        run: docker build --file Containerfile --tag tines-mcp:ci .
      - name: Verify container identity and shutdown
        run: bash scripts/container-smoke.sh tines-mcp:ci

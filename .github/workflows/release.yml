name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z source tag (no tag is created)
        type: string
        required: true
      source_sha:
        description: Full expected source commit SHA
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tines-mcp-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'dstoc/tines-mcp' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Maintain reviewed Rust release PR and create source release after merge
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1; release-please 17.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    # Dispatch must work when release-please is skipped; failed/cancelled jobs never authorize a push.
    if: >-
      !cancelled() && github.repository == 'dstoc/tines-mcp' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.release-please.result == 'success' &&
        needs.release-please.outputs.release_created == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'push' && needs.release-please.outputs.tag_name || inputs.tag }}
      RELEASE_SOURCE: ${{ github.event_name == 'push' && needs.release-please.outputs.sha || inputs.source_sha }}
      RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_PLEASE_RESULT: ${{ needs.release-please.result }}
    steps:
      - name: Initialize ephemeral Docker configuration
        run: printf 'DOCKER_CONFIG=%s/release-docker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out release orchestration from selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: workflow
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release handoff, source tag and ancestry
        id: source
        run: python3 workflow/scripts/release.py resolve --workflow workflow --source source --record release/record.json
      - name: Check out the exact application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
      - name: Check versions, registry authority and local runtime; publish once or select existing digest
        id: image
        run: python3 workflow/scripts/release.py publish --workflow workflow --source source --record release/record.json
      - name: Attest build provenance for newly published bytes
        if: steps.image.outputs.new_image == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/dstoc/tines-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact release source for newly published bytes
        if: steps.image.outputs.new_image == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/dstoc/tines-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://github.com/dstoc/tines-mcp/attestations/release-identity/v1
          predicate-path: release/release-identity.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify both signed statements, anonymous digest pull and runtime
        run: python3 workflow/scripts/release.py accept --workflow workflow --source source --record release/record.json
      - name: Record outcome and recovery boundary
        if: always()
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: python3 workflow/scripts/release.py report --workflow workflow --source source --record release/record.json
      - name: Retain release evidence (copy successful records to durable release records)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adapter-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Remove ephemeral registry login
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-docker"
